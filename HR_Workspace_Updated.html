function sum(c,r){const m=r.match(/SUM\(([A-Z])(\d+):([A-Z])(\d+)\)/);if(!m)return'';let t=0;for(let i=+m[2];i<=+m[4];i++)t+=parseFloat(c[m[1]+i])||0;return t}

 if(d.k==='doc')body=`<div class="page" contenteditable="true" id="pg">${d.html}</div>`;
 else{const c=d.cells,L='ABCDEF'.split('');body=`<div class="sh"><table><tr><th></th>${L.map(l=>`<th>${l}</th>`).join('')}</tr>${Array.from({length:14},(_,i)=>`<tr><th>${i+1}</th>${L.map(l=>{const k=l+(i+1),v=c[k]||'';return`<td contenteditable="true" data-k="${k}">${esc(v.startsWith('=')?sum(c,v):v)}</td>`}).join('')}</tr>`).join('')}</table></div>`}
 $('#modal').innerHTML=`<div class="ov"><div class="ed"><div class="edh"><svg class="i"><use href="#i-${d.k==='doc'?'file-text':'table'}"/></svg><b>${esc(d.t)}</b>${d.k==='doc'?'<button class="btn" data-a="fmt" data-v="bold"><b>B</b></button><button class="btn" data-a="fmt" data-v="italic"><i>I</i></button><button class="btn" data-a="fmt" data-v="insertUnorderedList"><svg class="i"><use href="#i-list"/></svg></button>':'<small style="color:var(--mu)">Gõ =SUM(B2:B3) để cộng</small>'}<button class="btn" data-a="close"><svg class="i"><use href="#i-x"/></svg></button></div>${body}</div></div>`;
 const el=$('.ed');let t;
 if(d.k==='doc')el.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{d.html=$('#pg').innerHTML;saveDoc(d)},400)});
 else{el.addEventListener('focusin',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k&&d.cells[k])e.target.textContent=d.cells[k]});
  el.addEventListener('focusout',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;const v=e.target.textContent.trim();if(v)d.cells[k]=v;else delete d.cells[k];e.target.textContent=v.startsWith('=')?sum(d.cells,v):v;saveDoc(d)})}

 if(uid)sb.from('ws_events').insert({title:t,kind:k,starts_at:d.toISOString(),attendees:ids}).then(r=>{if(r.error)return alert(r.error.message);notify(ids,`${ME.n} mời bạn: ${t} (${fdt(d)})`,'events');pull()});
 else{S.events.unshift({id:Date.now(),t,k,at:d.toISOString(),who:who.map(m=>m.n),ids:[]});save();render()}};
A.glogin=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0].split('?')[0]}});
A.plogin=async()=>{const r=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});if(r.error)$('#lerr').textContent='Sai email hoặc mật khẩu';else boot()};
A.demo=()=>{$('#modal').innerHTML=''};
A.out=async()=>{await sb.auth.signOut();location.reload()};
A.cm=(v,el)=>{const id=el.closest('.card').dataset.id,x=(v==='project'?S.projects:S.feed).find(p=>String(p.id)===id);CM={tt:v,ti:id};
 $('#modal').innerHTML=`<div class="ov"><div class="ed sm"><div class="edh"><b>Bình luận · ${esc(((x&&x.t)||'').slice(0,40))}</b><button class="btn" data-a="close"><svg class="i"><use href="#i-x"/></svg></button></div><div class="cl" id="cml"></div><div class="cin"><input id="cmi" placeholder="Viết bình luận, gõ @ để nhắc tên…" autocomplete="off"><button class="btn p" data-a="cmsend"><svg class="i"><use href="#i-send"/></svg></button></div></div></div>`;cmRender()};
A.cmsend=()=>{const i=$('#cmi'),b=i&&i.value.trim();if(!b||!CM)return;i.value='';const{tt,ti}=CM,pj=tt==='project'?S.projects.find(p=>String(p.id)===String(ti)):null,fd=tt==='feed'?S.feed.find(p=>String(p.id)===String(ti)):null;
 let to=nIds(mentions(b));if(pj)to=to.concat(S.members.filter(m=>(pj.who||[]).includes(m.n)).map(m=>m.id));if(fd&&fd.uid)to.push(fd.uid);
 const lb=pj?`dự án “${pj.t}”`:'một bài viết',view=tt==='feed'?'feed':'projects';
 if(uid)sb.from('ws_comments').insert({tt,ti:+ti,body:b}).then(r=>{if(r.error)return alert(r.error.message);notify(to,`${ME.n} bình luận ở ${lb}`,view);pull().then(cmRender)});
 else{S.comments.push({id:Date.now(),tt,ti,who:ME.n,t:b,time:hm(new Date())});notify(nIds(mentions(b)),`${ME.n} nhắc bạn ở ${lb}`,view);save();render();cmRender()}};
const oc=A.ch;A.ch=(v,e)=>{oc(v,e);if(uid)rt()};
const statCard=()=>{const t=S.stat;if(!t)return'';const pc=Math.round(t.db_mb/5),w=t.db_mb>=350,l=t.last;
 return `<div class="it" style="${w?'border-color:var(--wa)':''}"><b>${w?'⚠ Sắp đầy dung lượng':'Dung lượng dữ liệu'}</b><div class="pg" style="margin:6px 0"><i style="width:${Math.min(pc,100)}%"></i></div>${t.db_mb} / 500 MB (${pc}%)<small>${l?`Dọn lần cuối ${new Date(l.ran_at).toLocaleString('vi')}: xóa ${l.msgs} tin, ${l.feed} bài`:'Chưa có lần dọn nào (tự chạy 3h sáng mỗi ngày)'}</small></div>`};
const stat=()=>{if(uid&&role==='manager')sb.rpc('ws_status').then(r=>{if(r.data){S.stat=r.data;side()}})};
const ot=A.tab;A.tab=(v,e)=>{ot(v,e);if(+v===1)stat()};
Object.keys(W).forEach(k=>{const o=A[k];A[k]=(v,el)=>uid?W[k](v,el):o(v,el)});
$('#fab').onclick=()=>$('#side').classList.toggle('open');
fit();render();watchWorkspaceLanguage();boot();
</script></body></html>
